spring.application.name=barber_book
server.port=${PORT}
springdoc.api-docs.enabled=true
# ===============================
# = DATA SOURCE
# ===============================
# Set here configurations for the database connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# = JPA / HIBERNATE / FLYWAY
# ===============================
# Show or not log for each sql query
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
# Hibernate ddl auto (create, create-drop, update): with "create-drop" the database
# schema will be automatically created afresh for every start of application
spring.jpa.hibernate.ddl-auto=validate
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.security=INFO
logging.level.org.azdev.barber_book=INFO
app.performance.slow-request-threshold-ms=${APP_PERFORMANCE_SLOW_REQUEST_THRESHOLD_MS:2000}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoint.prometheus.enabled=true
management.endpoints.web.base-path=/actuator

# ===============================
# = SPRING SECURITY
# ===============================
api.security.token.secret=${API_SECURITY_TOKEN_SECRET}
api.security.token.expiration=3600000
app.security.cors.allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS:}
app.rate-limit.capacity=${APP_RATE_LIMIT_CAPACITY:5}
app.rate-limit.refill-duration-minutes=${APP_RATE_LIMIT_REFILL_DURATION_MINUTES:60}

# ===============================
# = PROXY CONFIGURATION
# ===============================
server.forward-headers-strategy=NATIVE